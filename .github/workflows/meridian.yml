name: meridian

# Build every subsystem, run the existing test suites, run the pipeline, and
# check the oracle value. Strict about the oracle; ui-next's npm test is a stub,
# so the workflow runs its typecheck instead.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Fortran toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          gfortran --version | head -1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ---- build -------------------------------------------------------
      - name: Build subsystems
        run: make all

      # ---- the tests that exist ----------------------------------------
      - name: Model characterization and trace validation
        run: make -C model test

      - name: Ingest acceptance test
        run: make -C ingest test

      - name: Reporting tests
        run: cd reporting && python -m pip install pytest && python -m pytest reporting/tests -q

   # Legacy console characterization tests (Watchtower, MRD-253). Loads the
      # real ES5 console files into jsdom against recorded API responses in
      # dashboard/test/fixtures/api. Dev-only; the console has no build step.
      - name: Dashboard tests
        working-directory: dashboard/test
        run: |
          npm ci
          npm test

      - name: Analytics tests
        run: python -m pip install pytest && MRD_REQUIRE_BINARIES=1 python -m pytest analytics/tests -v
