name: freeze-main

# Locks `main` (read-only for everyone) at the Nov 25 hard deadline, 11:59 PM Eastern.
# Eastern is UTC-5 in late November, so 11:59 PM Nov 25 is 04:59 UTC Nov 26.
# GitHub scheduled runs can start late. If this run has not completed by 00:15 Eastern
# on Nov 26, lock `main` by hand: Settings > Branches > main > Lock branch.
#
# Setup (instructor, once): create a fine-grained token with "Administration: Read and write"
# on this repository, and save it as the repository secret FREEZE_TOKEN.
# Unlock for Demo Day fixes with the workflow_dispatch input `action: unlock`.

on:
  schedule:
    - cron: '59 4 26 11 *'
  workflow_dispatch:
    inputs:
      action:
        description: 'lock or unlock'
        required: true
        default: lock
        type: choice
        options: [lock, unlock]

permissions: {}

jobs:
  set-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Set branch lock on main
        env:
          GH_TOKEN: ${{ secrets.FREEZE_TOKEN }}
          ACTION: ${{ inputs.action || 'lock' }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then echo "FREEZE_TOKEN secret is not set"; exit 1; fi
          if [ "$ACTION" = "lock" ]; then LOCK=true; else LOCK=false; fi
          gh api --method PUT \
            repos/${{ github.repository }}/branches/main/protection \
            --input - <<JSON
          {
            "required_status_checks": {"strict": false, "contexts": ["build-and-test"]},
            "enforce_admins": false,
            "required_pull_request_reviews": {"dismiss_stale_reviews": true, "required_approving_review_count": 1},
            "restrictions": null,
            "lock_branch": ${LOCK},
            "allow_force_pushes": false,
            "allow_deletions": false
          }
          JSON
          echo "main lock_branch=${LOCK}"
