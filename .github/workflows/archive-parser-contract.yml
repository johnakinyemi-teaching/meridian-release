name: Archive parser contract

on:
  pull_request:
    branches: [main, team/archive]
  push:
    branches: [main, team/archive, 'archive/**']

permissions:
  contents: read

jobs:
  parser-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Check MRD-143 contract against recorded outputs
        run: >-
          python -m pytest
          analytics/tests/test_mrd143_parser_characterization.py
          analytics/tests/test_mrd143_parser_contract.py -q
