name: Archive parser contract

on:
  pull_request:
    branches: [main, team/archive]
  push:
    branches: [main, team/archive, 'archive/**']

permissions:
  contents: read

jobs:
  parser-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run the Archive tests (MRD-143 parser contract, MRD-246 output QC)
        run: python -m pytest analytics/tests -q
